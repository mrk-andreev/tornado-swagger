name: Publish to PyPI

# Replaces the old Travis deploy step: build sdist + wheel and upload to PyPI
# when a tag is pushed. Authentication uses PyPI Trusted Publishing (OIDC),
# so no API token secret is stored in the repository.
on:
  push:
    tags:
      - "*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment can be protected in repo settings to gate releases.
    environment:
      name: pypi
      url: https://pypi.org/project/tornado-swagger/
    permissions:
      # Required for Trusted Publishing (OIDC); mints a short-lived token.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Mirrors the old Travis "skip_existing: true" behavior.
          skip-existing: true
