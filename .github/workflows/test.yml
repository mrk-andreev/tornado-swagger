name: Run the test suite
on:
  push:
    branches:
      - master
      - test-workflow
  pull_request:
  workflow_dispatch:

jobs:
  test-for-python3:
    strategy:
      fail-fast: true
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.7
            3.8
            3.9
            3.10
      - name: Install tox
        run: python -m pip install "tox>=4,<5"
      - name: Run unit tests
        run: python -m tox
