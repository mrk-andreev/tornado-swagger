name: Run the test suite
on:
  push:
    branches:
      - master
      - test-workflow
  pull_request:
  workflow_dispatch:

jobs:
  test-for-python3:
    strategy:
      fail-fast: true
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14" ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: python -m pip install "tox>=4,<5"
      - name: Run unit tests
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          TOX_PREFIX="py${PYTHON_VERSION/./}"
          TOX_ENVS="$(python -m tox -l | grep "^${TOX_PREFIX}-" | tr '\n' ',' | sed 's/,$//')"
          test -n "${TOX_ENVS}"
          python -m tox -e "${TOX_ENVS}"
