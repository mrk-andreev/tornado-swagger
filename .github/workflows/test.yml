name: Run the test suite
on:
  push:
    branches:
      - master
      - test-workflow
  pull_request:
  workflow_dispatch:

jobs:
  test-for-python3:
    strategy:
      fail-fast: true
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14" ]
        exclude:
          # Python 3.7/3.8 are not available on ubuntu-24.04 (ubuntu-latest)
          - os: ubuntu-latest
            python-version: "3.7"
          - os: ubuntu-latest
            python-version: "3.8"
        include:
          # Run the older Python versions on ubuntu-22.04 instead
          - os: ubuntu-22.04
            python-version: "3.7"
          - os: ubuntu-22.04
            python-version: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: python -m pip install "tox>=4,<5"
      - name: Run unit tests
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          TOX_PREFIX="py${PYTHON_VERSION/./}"
          TOX_ENVS="$(python -m tox -l | grep "^${TOX_PREFIX}-" | tr '\n' ',' | sed 's/,$//')"
          test -n "${TOX_ENVS}"
          python -m tox -e "${TOX_ENVS}"

  # Python 3.6 has no build in the setup-python tool cache for the available
  # runners (ubuntu-20.04 is retired), so it runs inside the python:3.6 image.
  # tox 4 requires Python >=3.7, hence the tox<4 pin here.
  test-for-python36:
    runs-on: ubuntu-latest
    container: python:3.6
    steps:
      - uses: actions/checkout@v3
      - name: Install tox
        run: python -m pip install "tox>=3.28,<4"
      - name: Run unit tests
        shell: bash
        run: |
          TOX_ENVS="$(python -m tox -l | grep "^py36-" | tr '\n' ',' | sed 's/,$//')"
          test -n "${TOX_ENVS}"
          python -m tox -e "${TOX_ENVS}"
